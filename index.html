<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verbes en couleurs</title>
<meta name="description" content="Apprendre la conjugaison du CM2 : le verbe en 3 morceaux de couleur (radical, marque de temps, marque de personne), 6 temps, révisions espacées.">
<meta name="theme-color" content="#FFF4FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1933" media="(prefers-color-scheme: dark)">
<meta name="appli-marc" content="oui">
<meta name="appli-theme" content="ecrire">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verbes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ==========================================================================
   Charte commune des applis — v1 (1er novembre 2026)
   À coller en haut du <style> de chaque index.html (pas de fichier externe :
   chaque appli reste un seul index.html). Voir charte.md pour les règles.
   Polices : copier design/fonts/ dans le dossier fonts/ de l'appli.
   ========================================================================== */

@font-face { font-family: 'Fredoka'; font-style: normal; font-weight: 300 700; font-display: swap; src: url('fonts/fredoka-latin.woff2') format('woff2'); }
@font-face { font-family: 'Nunito'; font-style: normal; font-weight: 200 1000; font-display: swap; src: url('fonts/nunito-latin.woff2') format('woff2'); }

/* ---------- 1. Jetons (couleurs, formes, polices) ---------- */
:root {
  color-scheme: light dark;

  /* Fond et surfaces */
  --bg: #FFF4FA;            /* haut du dégradé de fond (rose très pâle) */
  --bg2: #EEF4FF;           /* bas du dégradé (bleu très pâle) */
  --surface: #FFFFFF;       /* cartes, bulles, boutons doux */
  --surface2: #F4F1FF;      /* touches du clavier, zones calmes */
  --track: #E4DEF7;         /* fond des barres de progression */

  /* Encre : même violet nuit que le contour des 30 personnages */
  --ink: #2B2340;           /* texte */
  --muted: #6B6190;         /* texte secondaire */
  --line: #2B2340;          /* contours et ombres dures */

  /* Rôles de couleur (un rôle = une couleur, dans toutes les applis) */
  --action: #3B5BFF;        /* LE bouton principal (Commencer, Valider, Suivant) */
  --on-action: #FFFFFF;
  --pompon: #FF6FA5;        /* rose de Pompon : cœurs, « Nouveau », bouton ▶ de l'accueil */
  --on-pompon: #FFFFFF;
  --sun: #FFD45C;           /* étoiles, récompenses, astuces, focus clavier */
  --on-sun: #2B2340;
  --good: #2BC48A;          /* bonne réponse, OK */
  --on-good: #0B2E20;
  --tint-good: #D8F6E8;     /* carte réussie */
  --retry: #FFB38A;         /* « à retenter » (jamais de rouge) */
  --tint-retry: #FFE4D6;    /* carte à retenter */

  /* 6 pastels (pastilles A-F, cartes de l'accueil, zones de carte) */
  --p-rose: #FFD2E3;
  --p-soleil: #FFE9A3;
  --p-menthe: #C6F1E2;
  --p-lilas: #E0D6FF;
  --p-ciel: #CDEBFF;
  --p-peche: #FFDCC8;

  /* 6 couleurs vives (icônes, personnages, confettis) */
  --v-rose: #FF6FA5;
  --v-soleil: #FFD45C;
  --v-menthe: #8EE3C8;
  --v-lilas: #C9B6FF;
  --v-ciel: #9AD7FF;
  --v-peche: #FFB38A;

  /* Lecture (applis de français) */
  --syl-a: #2F4FE0;         /* syllabes alternées : bleu… */
  --syl-b: #C92A62;         /* …et framboise */
  --muette: #A39DB8;        /* lettre muette grisée */
  --son-cle: #FFE9A3;       /* fond de la lettre qui décide du son */
  --ligne-b: #EEF1FF;       /* une ligne sur deux */

  /* Polices */
  --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;  /* titres, boutons, chiffres */
  --body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif; /* texte */
  --lecture: 'Nunito', Arial, sans-serif;                        /* texte à lire */

  /* Formes */
  --bord: 3px;
  --r-carte: 28px;
  --r-btn: 22px;
  --r-touche: 18px;
  --r-pastille: 999px;
  --ombre: 0 5px 0 var(--line);
  --ombre-carte: 0 6px 0 var(--line);
  --toucher: 56px;          /* hauteur mini d'un bouton */

  /* Mouvement */
  --ressort: cubic-bezier(.3, 1.6, .5, 1);
  --deco: .55;              /* opacité des petits dessins de fond */
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1E1933;
    --bg2: #171B36;
    --surface: #2B2448;
    --surface2: #352D57;
    --track: #3D3466;
    --ink: #FBEFFF;
    --muted: #C3B7E8;
    --line: #120E22;        /* le contour reste sombre, même la nuit */
    --action: #7F98FF;
    --on-action: #120E22;
    --pompon: #FF8DB9;
    --on-pompon: #2A0F1E;
    --good: #3DDC97;
    --tint-good: #1D4A3D;
    --retry: #FF9F7A;
    --tint-retry: #5A3326;
    --p-rose: #5A3552;
    --p-soleil: #5A4A24;
    --p-menthe: #24504A;
    --p-lilas: #433A72;
    --p-ciel: #283F68;
    --p-peche: #5A3A2E;
    --syl-a: #9DB0FF;
    --syl-b: #FF8DB4;
    --muette: #7D7499;
    --son-cle: #5A4A24;
    --ligne-b: #262046;
    --deco: .25;
  }
}

/* ---------- 2. Base ---------- */
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg2); }
body {
  margin: 0;
  min-height: 100dvh;
  background: linear-gradient(170deg, var(--bg) 0%, var(--bg2) 100%) no-repeat;
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.45;
  overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.1; margin: 0; }
h1 { font-size: clamp(1.6rem, 7vw, 2.4rem); }
h2 { font-size: 1.4rem; }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 3. En-tête commun : 🏠 · titre · ⚙ ---------- */
.entete { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.entete .titre { flex: 1; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 1.25rem; text-align: center; }
.rond {                    /* bouton rond (🏠, ⚙, ✕, son) */
  flex: none; width: 48px; height: 48px; border-radius: 50%;
  display: grid; place-items: center; font-size: 22px; text-decoration: none; color: var(--ink);
  background: var(--surface); border: var(--bord) solid var(--line); box-shadow: 0 4px 0 var(--line); cursor: pointer;
}
.rond:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }

/* ---------- 4. Boutons ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: var(--toucher); padding: 10px 22px;
  font: 600 1.2rem var(--display); text-decoration: none;
  color: var(--ink); background: var(--surface);
  border: var(--bord) solid var(--line); border-radius: var(--r-btn);
  box-shadow: var(--ombre); cursor: pointer;
  transition: transform .1s ease, box-shadow .1s ease;
}
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.btn:disabled { opacity: .45; cursor: default; transform: none; box-shadow: var(--ombre); }
.btn-action { background: var(--action); color: var(--on-action); }   /* un seul par écran */
.btn-soleil { background: var(--sun); color: var(--on-sun); }         /* bonus, installer */
.btn-ok { background: var(--good); color: var(--on-good); }
.btn-petit { width: auto; min-height: 44px; padding: 6px 16px; font-size: 1rem; border-radius: var(--r-pastille); box-shadow: 0 4px 0 var(--line); }

/* ---------- 5. Cartes, bulles, pastilles ---------- */
.carte {
  background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: var(--r-carte); box-shadow: var(--ombre-carte); padding: 20px;
}
.carte.reussie { background: var(--tint-good); }
.carte.a-retenter { background: var(--tint-retry); }
.bulle {                   /* bulle de dialogue d'un personnage */
  position: relative; background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: 26px; box-shadow: var(--ombre); padding: 12px 16px;
}
.pastille {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 2px 12px;
  border: 2px solid var(--line); border-radius: var(--r-pastille);
  background: var(--surface); font: 700 .9rem var(--body); white-space: nowrap;
}
.pastille.soleil { background: var(--p-soleil); }
.pastille.rose { background: var(--p-rose); }
.pastille.menthe { background: var(--p-menthe); }
.badge-nouveau {
  display: inline-block; background: var(--sun); color: var(--on-sun);
  border: var(--bord) solid var(--line); border-radius: var(--r-pastille);
  padding: 1px 10px 2px; font: 700 .85rem var(--display); transform: rotate(4deg);
}
.etiquette { font: 800 .75rem var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.astuce {
  background: var(--sun); color: var(--on-sun); border-radius: 18px;
  padding: 10px 14px; font-weight: 700;
}
.astuce::before { content: '💡 '; }

/* ---------- 6. Progression ---------- */
.barre { height: 18px; border: var(--bord) solid var(--line); border-radius: var(--r-pastille); background: var(--track); overflow: hidden; }
.barre > i { display: block; height: 100%; width: 0; background: var(--good); border-radius: inherit; transition: width .4s var(--ressort); }

/* ---------- 7. Choix A-F (QCM) et clavier ---------- */
.choix {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: var(--toucher);
  padding: 8px 14px; text-align: left; font: 600 1.1rem var(--display);
  background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: var(--r-touche); box-shadow: 0 4px 0 var(--line); cursor: pointer;
}
.choix:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.choix .lettre {
  flex: none; width: 30px; height: 30px; display: grid; place-items: center;
  border: 2px solid var(--line); border-radius: 10px; font-size: .9rem; background: var(--p-lilas);
}
.choix:nth-child(6n+1) .lettre { background: var(--p-rose); }
.choix:nth-child(6n+2) .lettre { background: var(--p-soleil); }
.choix:nth-child(6n+3) .lettre { background: var(--p-menthe); }
.choix:nth-child(6n+4) .lettre { background: var(--p-lilas); }
.choix:nth-child(6n+5) .lettre { background: var(--p-peche); }
.choix:nth-child(6n+6) .lettre { background: var(--p-ciel); }
.choix.bon { background: var(--tint-good); }
.choix.a-revoir { background: var(--tint-retry); }
.touche {
  min-height: 64px; font: 600 1.8rem var(--display);
  background: var(--surface); border: var(--bord) solid var(--line);
  border-radius: var(--r-touche); box-shadow: 0 4px 0 var(--line); cursor: pointer;
}
.touche:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.touche.douce { background: var(--surface2); }
.touche.ok { background: var(--good); color: var(--on-good); }

/* ---------- 8. Réglages : interrupteur ---------- */
.interrupteur { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: var(--toucher); font-weight: 700; cursor: pointer; }
.interrupteur input { appearance: none; flex: none; width: 58px; height: 34px; margin: 0; border: var(--bord) solid var(--line); border-radius: var(--r-pastille); background: var(--track); position: relative; cursor: pointer; transition: background .2s; }
.interrupteur input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); transition: transform .2s var(--ressort); }
.interrupteur input:checked { background: var(--good); }
.interrupteur input:checked::after { transform: translateX(24px); }

/* ---------- 9. Texte à lire (applis de français) ---------- */
.texte-lecture {
  font-family: var(--lecture); font-size: 22px; font-weight: 600; line-height: 2;
  letter-spacing: .02em; word-spacing: .12em; max-width: 34ch;
}
.texte-lecture .ligne { display: block; padding: 0 10px; border-radius: 10px; }
.texte-lecture .ligne:nth-child(even) { background: var(--ligne-b); }
.syl-a { color: var(--syl-a); }
.syl-b { color: var(--syl-b); }
.muette { color: var(--muette); }
.son-cle { background: var(--son-cle); border-radius: 6px; box-shadow: 0 0 0 2px var(--son-cle); }

/* ---------- 10. Animations (désactivables) ---------- */
@keyframes apparait { from { transform: scale(.85); opacity: 0; } }
@keyframes bravo { 0% { transform: scale(1); } 30% { transform: scale(1.08) rotate(-2deg); } 55% { transform: scale(.97) rotate(1deg); } 80% { transform: scale(1.02); } 100% { transform: scale(1); } }
@keyframes non { 0%, 100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-10px) rotate(-3deg); } 40% { transform: translateX(9px) rotate(2.5deg); } 60% { transform: translateX(-6px) rotate(-1.5deg); } 80% { transform: translateX(3px) rotate(.5deg); } }
@keyframes saute { 0%, 60%, 100% { transform: translateY(0) scale(1, 1); } 70% { transform: translateY(0) scale(1.06, .94); } 82% { transform: translateY(-10px) scale(.97, 1.03); } }
@keyframes flotte { 50% { transform: translateY(-12px) rotate(12deg); } }
@keyframes etoile { 0% { transform: translate(0, 0) scale(.3); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(var(--dx, 0), var(--dy, -80px)) scale(1) rotate(160deg); opacity: 0; } }
@keyframes arrive { 0% { transform: translateY(40px) scale(.6); opacity: 0; } 60% { transform: translateY(-8px) scale(1.05); opacity: 1; } 100% { transform: none; } }

.anim-apparait { animation: apparait .45s var(--ressort) both; }
.anim-bravo { animation: bravo .6s ease both; }          /* bonne réponse : la carte rebondit */
.anim-non { animation: non .5s ease both; }              /* erreur : la carte secoue la tête */
.anim-saute { animation: saute 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
.anim-arrive { animation: arrive .7s var(--ressort) both; } /* entrée d'un personnage */

/* Petits dessins de fond ★ ♥ ✿ ✦ */
.deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: var(--deco); }
.deco span { position: absolute; font-size: 22px; animation: flotte 7s ease-in-out infinite; }

/* Interrupteur « Animations » de l'appli : <html class="calme"> */
.calme *, .calme *::before, .calme *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ==========================================================================
   Verbes en couleurs : styles propres à l'appli
   ========================================================================== */
:root {
  /* Les 3 morceaux du verbe (toujours les mêmes) : radical, marque de temps, marque de personne */
  --m-rad: var(--p-ciel); --m-rad-b: var(--v-ciel);
  --m-tm: var(--p-lilas); --m-tm-b: var(--v-lilas);
  --m-pers: var(--p-rose); --m-pers-b: var(--v-rose);
  --encre-morceau: #2B2340;
}
@media (prefers-color-scheme: dark) {
  :root { --m-rad: #CDEBFF; --m-tm: #E0D6FF; --m-pers: #FFD2E3; }
}
.wrap { position: relative; z-index: 1; }
body.jeu .wrap { height: 100dvh; display: flex; flex-direction: column; padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
body.jeu .entete { margin-bottom: 6px; }
body.jeu .entete .rond { width: 42px; height: 42px; font-size: 19px; }
body.jeu .deco { display: none; }
.vue { animation: apparait .35s var(--ressort) both; }
.pile { display: grid; gap: 14px; }
.ligne-btn { display: flex; gap: 10px; }
.ligne-btn > .btn { flex: 1; }
.centre { text-align: center; }
.muted { color: var(--muted); }
.petit { font-size: .95rem; }
p { margin: 0; }
.lien { background: none; border: 0; color: var(--muted); font-weight: 800; text-decoration: underline; cursor: pointer; padding: 10px; justify-self: center; min-height: 44px; }

/* ---------- Les morceaux colorés ---------- */
.forme { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 2px; font: 800 1em var(--lecture); vertical-align: baseline; }
.mo { display: inline-block; padding: 0 .16em; border-radius: .3em; border: 2px solid transparent; color: var(--encre-morceau); line-height: 1.25; }
.mo.rad, .mo.ppr { background: var(--m-rad); border-color: var(--m-rad-b); }
.mo.tm { background: var(--m-tm); border-color: var(--m-tm-b); }
.mo.pers, .mo.acc { background: var(--m-pers); border-color: var(--m-pers-b); }
.mo.ppf { background: var(--m-rad); border: 2px dashed var(--line); }
.mo.ppr + .mo.ppf { margin-left: -2px; }
.mo.aux { background: #fff; border: 3px solid var(--m-tm-b); }
.mo.esp { width: .3em; padding: 0; border: 0; background: none; }
.mo.faux { box-shadow: 0 0 0 3px var(--retry), 0 0 0 5px var(--line); }
.mo.clignote { animation: clignote 1s ease 2; }
@keyframes clignote { 50% { transform: scale(1.18); } }
.mo.vide { background: var(--surface2); border: 2px dashed var(--muted); color: var(--muted); min-width: 1.4em; text-align: center; }
.lettre-faux { border-radius: 6px; box-shadow: 0 0 0 3px var(--retry); }
.legende { display: flex; flex-wrap: wrap; gap: 6px; font-size: .85rem; font-weight: 800; }
.legende .mo { font: 800 .85rem var(--body); }

/* ---------- Accueil ---------- */
.bonjour { font: 700 1.5rem var(--display); }
.sous-btn { text-align: center; color: var(--muted); font-weight: 800; margin-top: -6px; }
.tuiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tuile {
  position: relative; display: grid; gap: 4px; align-content: start; min-height: 112px; padding: 10px 12px 12px; text-align: left; cursor: pointer;
  border: var(--bord) solid var(--line); border-radius: 22px; box-shadow: 0 4px 0 var(--line); background: var(--p-ciel); color: var(--ink);
}
.tuile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.tuile .em { font-size: 26px; line-height: 1; }
.tuile .tt { font: 700 1.05rem/1.1 var(--display); }
.tuile .mq { justify-self: start; font: 800 .8rem var(--body); background: var(--m-tm); color: var(--encre-morceau); border: 2px solid var(--line); border-radius: 999px; padding: 0 8px; }
.tuile .barre { height: 12px; border-width: 2px; margin-top: 2px; }
.tuile .compte { font-size: .8rem; font-weight: 800; color: var(--muted); }
.tuile .coin { position: absolute; top: -12px; right: -6px; display: flex; gap: 4px; }
.tuile .trophee { position: absolute; top: 6px; right: 8px; font-size: 24px; }
.tuile:nth-child(6n+1) { background: var(--p-ciel); }
.tuile:nth-child(6n+2) { background: var(--p-lilas); }
.tuile:nth-child(6n+3) { background: var(--p-menthe); }
.tuile:nth-child(6n+4) { background: var(--p-soleil); }
.tuile:nth-child(6n+5) { background: var(--p-rose); }
.tuile:nth-child(6n+6) { background: var(--p-peche); }
.conseil { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; font: 800 .78rem var(--body); padding: 1px 8px; white-space: nowrap; }
.carte-lien { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer; color: var(--ink); padding: 14px 16px; }
.carte-lien:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.carte-lien .em { font-size: 30px; flex: none; }
.carte-lien .tt { font: 700 1.15rem var(--display); display: block; }
.carte-lien .st { font-size: .9rem; color: var(--muted); font-weight: 700; }
.mini-tableau { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; width: 88px; flex: none; }
.mini-tableau i { display: block; height: 5px; border-radius: 2px; background: var(--track); }
.mini-tableau i.encours { background: var(--v-ciel); }
.mini-tableau i.su { background: var(--sun); }

/* ---------- Page d'un temps ---------- */
.rappel { font-size: 1.1rem; font-weight: 700; display: grid; gap: 8px; }
.rappel .ex { font-size: 1.35rem; }
.familles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fam {
  display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 8px 10px; text-align: left; cursor: pointer; color: var(--ink);
  background: var(--surface); border: var(--bord) solid var(--line); border-radius: 18px; box-shadow: 0 4px 0 var(--line); font: 700 1rem var(--display);
}
.fam:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.fam .etat { flex: none; min-width: 34px; height: 30px; display: grid; place-items: center; border-radius: 999px; border: 2px solid var(--line); background: var(--surface2); font: 800 .8rem var(--body); padding: 0 4px; }
.fam.su .etat { background: var(--sun); }
.fam.encours .etat { background: var(--m-tm); color: var(--encre-morceau); }
.fam.due .etat { background: var(--p-peche); }

/* ---------- Écran de question ---------- */
body.jeu .vjeu { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.points { display: flex; gap: 4px; align-items: center; justify-content: center; flex-wrap: wrap; min-height: 12px; }
.points i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--track); }
.points i.fait { background: var(--good); }
.points i.raté { background: var(--retry); }
.points i.ici { background: var(--sun); transform: scale(1.25); }
.tete { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.tete .pastille { min-height: 30px; font-size: .95rem; }
.tete .inf { background: var(--m-rad); color: var(--encre-morceau); font-family: var(--display); font-weight: 700; }
.tete .tps { background: var(--m-tm); color: var(--encre-morceau); }
.tete .suj { background: var(--m-pers); color: var(--encre-morceau); }
.zone {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; position: relative;
  background: var(--surface); border: var(--bord) solid var(--line); border-radius: var(--r-carte); box-shadow: var(--ombre-carte);
  padding: 12px 14px; display: flex; flex-direction: column;
}
.zin { margin: auto 0; display: flex; flex-direction: column; gap: 10px; }   /* centré, mais lisible depuis le haut si ça déborde */
.zone.reussie { background: var(--tint-good); }
.zone.a-retenter { background: var(--tint-retry); }
.consigne { font: 700 1.15rem/1.25 var(--display); text-align: center; }
.grosse { font-size: clamp(1.6rem, 8vw, 2.2rem); text-align: center; }
.grosse .suj-txt { font: 800 1em var(--lecture); margin-right: .25em; }
.phrase-trou { font: 700 clamp(1.2rem, 5.6vw, 1.45rem)/1.7 var(--lecture); text-align: center; }
.trou { display: inline-flex; flex-direction: column; align-items: center; vertical-align: baseline; line-height: 1.3; }
.trou .t { display: inline-block; min-width: 4.5ch; border-bottom: 4px solid var(--action); padding: 0 4px; min-height: 1.3em; }
.trou .t.actif { background: var(--p-soleil); border-radius: 8px 8px 0 0; }
.trou small { font: 800 .72rem var(--body); color: var(--muted); white-space: nowrap; }
.trou.rempli .t { border-color: var(--good); }
.astuce { font-size: 1rem; }
.astuce .forme { font-size: 1.1em; }
.cote { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; align-items: center; }
.cote > div { display: grid; gap: 2px; justify-items: center; font-size: .8rem; font-weight: 800; }
.cote .forme { font-size: 1.25rem; }
.recompense-mini { position: absolute; right: 6px; bottom: 6px; width: 64px; height: 64px; overflow: visible; pointer-events: none; }
.titre-recit { font: 700 1rem var(--display); color: var(--muted); text-align: center; }
.recit-lu { font: 700 1.1rem/1.9 var(--lecture); }
.recit-lu p + p { margin-top: 4px; }

/* Bas de l'écran : clavier, étiquettes, choix */
.bas { flex: none; display: flex; flex-direction: column; gap: 8px; }
.tape {
  min-height: 52px; display: flex; align-items: center; justify-content: center; gap: .3em; padding: 2px 10px;
  background: var(--surface); border: var(--bord) solid var(--line); border-radius: var(--r-touche);
  font: 800 1.7rem var(--lecture); white-space: nowrap; overflow: hidden;
}
.tape .s { color: var(--muted); }
.tape .caret { display: inline-block; width: 3px; height: 1.1em; background: var(--action); margin-left: 1px; animation: caret 1s steps(1) infinite; vertical-align: middle; }
@keyframes caret { 50% { opacity: 0; } }
.kb { display: flex; flex-direction: column; gap: 5px; user-select: none; -webkit-user-select: none; }
.kb .r { display: flex; gap: 4px; }
.kb .touche { flex: 1 1 0; min-width: 0; min-height: 46px; padding: 0; display: grid; place-items: center; font: 700 1.3rem var(--lecture); border-width: 2.5px; border-radius: 11px; box-shadow: 0 3px 0 var(--line); }
.kb .touche:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.kb .touche.acc { background: var(--surface2); }
.kb .wide { flex-grow: 1.6; }
.kb .space { flex-grow: 3; font: 700 .9rem var(--body); color: var(--muted); }
/* Touche qui s'éclaire quand on appuie (charte : soleil = focus clavier) */
.kb .touche.allume { background: var(--sun); color: var(--on-sun); position: relative; z-index: 2; animation: touche-allume .3s ease-out; }
@keyframes touche-allume { 0% { transform: scale(1.18) translateY(-4px); } 100% { transform: none; } }
.kb .valider { flex-grow: 3; background: var(--action); color: var(--on-action); font: 700 1.1rem var(--display); }
.kb .valider:disabled { opacity: .45; }
.cases { display: flex; justify-content: center; align-items: stretch; gap: 4px; flex-wrap: wrap; }
.case {
  min-width: 52px; min-height: 52px; padding: 2px 8px; display: grid; place-items: center; cursor: pointer;
  font: 800 1.5rem var(--lecture); color: var(--encre-morceau); border-radius: 12px; border: 3px dashed var(--line);
}
.case.rad, .case.ppr { background: var(--m-rad); }
.case.tm { background: var(--m-tm); }
.case.pers, .case.acc { background: var(--m-pers); }
.case.aux { background: #fff; border-color: var(--m-tm-b); border-style: solid; }
.case.pleine { border-style: solid; }
.case.faux { box-shadow: 0 0 0 3px var(--retry); }
.case .lbl { font: 800 .62rem var(--body); color: #6B6190; text-transform: uppercase; letter-spacing: .06em; }
.reserve { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.eti {
  min-width: 58px; min-height: 52px; padding: 2px 12px; cursor: pointer; font: 800 1.4rem var(--lecture); color: var(--encre-morceau);
  border: var(--bord) solid var(--line); border-radius: 14px; box-shadow: 0 4px 0 var(--line);
}
.eti:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.eti.rad, .eti.ppr { background: var(--m-rad); }
.eti.tm { background: var(--m-tm); }
.eti.pers, .eti.acc { background: var(--m-pers); }
.eti.aux { background: #fff; border-color: var(--m-tm-b); box-shadow: 0 4px 0 var(--line); }
.eti.posee { visibility: hidden; }
.choix-grille { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choix-grille.trois { grid-template-columns: 1fr 1fr 1fr; }
.choix-grille .choix { justify-content: center; text-align: center; font-size: 1.15rem; min-height: 52px; padding: 6px 8px; }
.choix-grille .choix:disabled { opacity: .55; }
.bulles { display: grid; gap: 6px; }
.bulle-r { display: block; width: 100%; text-align: left; font: 700 .92rem/1.25 var(--body); color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 6px 10px; cursor: pointer; }
.bulle-r b { font-family: var(--display); }
.bulle-r.bon { background: var(--tint-good); }
.bulle-r.non { background: var(--tint-retry); }
.controle { font: 700 .88rem var(--body); color: var(--muted); text-align: center; }

/* ---------- Leçons ---------- */
.lecon { display: grid; gap: 12px; font-size: 1.1rem; font-weight: 600; }
.lecon h2 { font-size: 1.35rem; }
.lecon .grand { font-size: 1.6rem; text-align: center; }
.lecon .ex { font-size: 1.3rem; text-align: center; }
.train { display: flex; justify-content: center; gap: 4px; flex-wrap: wrap; }
.wagon { display: grid; justify-items: center; gap: 4px; }
.wagon .mo { font-size: 2rem; padding: 4px 12px; border-width: 3px; }
.wagon small { font: 800 .8rem var(--body); color: var(--muted); text-align: center; max-width: 92px; }
.personnes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.personnes .btn { min-height: 48px; font-size: 1.05rem; padding: 6px; }
.conj-liste { display: grid; gap: 4px; font-size: 1.25rem; }
.conj-liste .l { display: flex; gap: 8px; align-items: baseline; }
.conj-liste .l .s { min-width: 3.4em; text-align: right; color: var(--muted); font-weight: 800; font-family: var(--lecture); }
.conj-petit { font-size: 1rem; }
.etapes { display: flex; justify-content: center; gap: 6px; }
.etapes i { width: 10px; height: 10px; border-radius: 50%; background: var(--track); border: 2px solid var(--line); }
.etapes i.ici { background: var(--action); }

/* ---------- Tableau des verbes ---------- */
.tableau { display: grid; grid-template-columns: minmax(70px, 1.5fr) repeat(6, minmax(0, 1fr)); gap: 3px; align-items: stretch; font-size: .8rem; }
.tableau .th { font: 700 1.1rem var(--display); text-align: center; padding: 2px 0; }
.tableau .nom { font: 800 .78rem/1.1 var(--body); display: flex; align-items: center; padding-right: 2px; }
.tableau button.cell { min-height: 30px; border: 2px solid var(--line); border-radius: 8px; background: var(--track); cursor: pointer; padding: 0; font-size: .9rem; color: var(--encre-morceau); }
.tableau .cell.b1 { background: color-mix(in srgb, var(--v-lilas) 35%, var(--surface)); }
.tableau .cell.b2 { background: color-mix(in srgb, var(--v-lilas) 50%, var(--surface)); }
.tableau .cell.b3 { background: color-mix(in srgb, var(--v-lilas) 65%, var(--surface)); }
.tableau .cell.b4 { background: color-mix(in srgb, var(--v-lilas) 80%, var(--surface)); }
.tableau .cell.b5 { background: var(--v-lilas); }
.tableau .cell.b6 { background: var(--sun); }
.tableau .vide { border-radius: 8px; border: 2px dashed var(--track); }
.legende-t { display: flex; gap: 12px; flex-wrap: wrap; font-size: .85rem; font-weight: 800; align-items: center; }
.legende-t i { display: inline-block; width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--line); vertical-align: middle; margin-right: 4px; }
.info-case { display: grid; gap: 10px; }

/* ---------- Fin de séance, carnet ---------- */
.recompense { display: grid; justify-items: center; gap: 10px; text-align: center; }
.recompense svg { width: clamp(90px, 20vh, 150px); height: clamp(90px, 20vh, 150px); overflow: visible; }
.etoiles { font-size: 2rem; letter-spacing: .1em; }
.etoile-vole { position: fixed; z-index: 30; font-size: 26px; pointer-events: none; animation: etoile 1s ease-out forwards; }
.liste-avance { text-align: left; display: grid; gap: 4px; font-weight: 700; }
.jours { display: grid; grid-template-columns: repeat(14, 1fr); gap: 3px; }
.jours i { height: 22px; border-radius: 6px; border: 2px solid var(--line); background: var(--track); }
.jours i.joue { background: var(--good); }
table.stats { width: 100%; border-collapse: collapse; font-size: .95rem; }
table.stats td, table.stats th { padding: 4px 6px; border-bottom: 2px dashed var(--track); text-align: left; }
table.stats td.n { text-align: right; font-weight: 800; }
.res-liste { display: grid; gap: 6px; font-size: 1rem; }
.res-liste .l { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }

/* ---------- Réglages ---------- */
dialog { border: var(--bord) solid var(--line); border-radius: var(--r-carte); box-shadow: var(--ombre-carte); background: var(--surface); color: var(--ink); padding: 18px; width: min(520px, calc(100% - 24px)); max-height: calc(100dvh - 24px); }
dialog::backdrop { background: rgba(20, 14, 40, .45); }
dialog h2 { margin-bottom: 8px; }
.sep { border: 0; border-top: 2px dashed var(--track); margin: 8px 0; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin: 4px 0 8px; }
.seg button { min-height: 44px; font: 700 .95rem var(--display); color: var(--ink); background: var(--surface2); border: var(--bord) solid var(--line); border-radius: 14px; cursor: pointer; padding: 2px 4px; }
.seg button.on { background: var(--good); color: var(--on-good); }
.reglage-titre { font-weight: 800; margin-top: 6px; }
.choix-temps { display: flex; flex-wrap: wrap; gap: 8px; }
.choix-temps button { min-height: 44px; padding: 4px 12px; border: var(--bord) solid var(--line); border-radius: 999px; background: var(--surface2); font: 700 .95rem var(--display); color: var(--ink); cursor: pointer; }
.choix-temps button.on { background: var(--m-tm); color: var(--encre-morceau); }

/* ---------- Petits écrans ---------- */
@media (max-height: 760px) {
  body.jeu .vjeu { gap: 6px; }
  .kb .touche { min-height: 41px; font-size: 1.2rem; }
  .tape { min-height: 46px; font-size: 1.5rem; }
  .case, .eti { min-height: 46px; font-size: 1.3rem; }
  .tete .pastille { min-height: 28px; font-size: .88rem; }
}
@media (max-height: 640px) {
  body.jeu .entete { margin-bottom: 4px; }
  body.jeu .entete .rond { width: 38px; height: 38px; font-size: 17px; }
  body.jeu .entete .titre { font-size: 1.05rem; }
  .kb { gap: 4px; }
  .kb .touche { min-height: 36px; font-size: 1.1rem; border-radius: 9px; }
  .tape { min-height: 42px; font-size: 1.35rem; }
  .zone { padding: 8px 10px; }
  .zin { gap: 6px; }
  .astuce { font-size: .88rem; padding: 6px 10px; }
  .cote { gap: 8px; }
  .cote .forme { font-size: 1.05rem; }
  .cote > div + div { display: none; }   /* sur petit écran, seulement la forme écrite par erreur */
  .consigne { font-size: 1.02rem; }
  .phrase-trou { font-size: 1.12rem; line-height: 1.5; }
  .choix-grille .choix { min-height: 46px; }
  .case, .eti { min-height: 42px; min-width: 46px; font-size: 1.2rem; }
  .points i { width: 10px; height: 10px; }
  .bulle-r { font-size: .82rem; padding: 4px 8px; }
  .bulles { gap: 4px; }
}
@media (max-width: 340px) {
  .kb .r { gap: 3px; }
  .kb .touche { font-size: 1.05rem; border-width: 2px; }
  .tuile { min-height: 104px; padding: 8px 9px 10px; }
  .tuile .tt { font-size: .98rem; }
}
</style>
</head>
<body>
<div class="deco" aria-hidden="true"><span style="left:6%;top:12%">✿</span><span style="right:8%;top:30%;animation-delay:-2s">★</span><span style="left:10%;bottom:16%;animation-delay:-4s">♥</span><span style="right:12%;bottom:8%;animation-delay:-1s">✦</span></div>
<div class="wrap">
  <header class="entete">
    <a class="rond" id="bMaison" href="/" aria-label="Mes applis" title="Mes applis">🏠</a>
    <button class="rond" id="bRetour" type="button" aria-label="Revenir à l'accueil" title="Revenir à l'accueil" hidden>✕</button>
    <div class="titre" id="titreEntete">Verbes en couleurs</div>
    <button class="rond" id="bReglages" type="button" aria-label="Réglages" title="Réglages">⚙</button>
  </header>

  <!-- Accueil -->
  <main id="vAccueil" class="vue pile">
    <div class="bonjour" id="aBonjour">Bonjour !</div>
    <button class="btn btn-action" id="bSeance" type="button">▶ Ma séance du jour</button>
    <div class="sous-btn" id="aSousSeance"></div>
    <div class="etiquette">Les 6 temps</div>
    <div class="tuiles" id="aTemps"></div>
    <button class="carte carte-lien" id="bTableau" type="button"><span class="mini-tableau" id="aMini" aria-hidden="true"></span><span><span class="tt">Mon tableau des verbes</span><span class="st" id="aTableauSt"></span></span></button>
    <button class="carte carte-lien" id="bSon" type="button"><span class="em">🔎</span><span><span class="tt">Le son /é/</span><span class="st">-é, -er, -ez, -ait : la routine pour ne plus hésiter</span></span></button>
    <button class="carte carte-lien" id="bRecits" type="button"><span class="em">📜</span><span><span class="tt">Petits récits</span><span class="st" id="aRecitsSt">Des histoires au passé simple</span></span></button>
    <button class="carte carte-lien" id="bTest" type="button"><span class="em">✏️</span><span><span class="tt">Je me teste</span><span class="st">12 questions sans aide</span></span></button>
    <button class="lien" id="bParent" type="button">Carnet du parent</button>
  </main>

  <!-- Page d'un temps -->
  <main id="vTemps" class="vue pile" hidden></main>

  <!-- Leçon -->
  <main id="vLecon" class="vue pile" hidden></main>

  <!-- Question -->
  <main id="vJeu" class="vue vjeu" hidden>
    <div class="points" id="jPoints" aria-hidden="true"></div>
    <div class="tete" id="jTete"></div>
    <div class="zone" id="jZone"></div>
    <div class="bas" id="jBas"></div>
  </main>

  <!-- Fin de séance, résultats -->
  <main id="vFin" class="vue pile" hidden></main>

  <!-- Tableau des verbes -->
  <main id="vTableau" class="vue pile" hidden></main>

  <!-- Petits récits, Je me teste (choix) -->
  <main id="vListe" class="vue pile" hidden></main>

  <!-- Carnet du parent -->
  <main id="vParent" class="vue pile" hidden></main>
</div>

<dialog id="dReglages">
  <h2>⚙ Réglages</h2>
  <label class="interrupteur">🎵 Sons<input type="checkbox" id="rSon"></label>
  <label class="interrupteur">✨ Animations<input type="checkbox" id="rAnim"></label>
  <label class="interrupteur">📳 Vibrations<input type="checkbox" id="rVibre"></label>
  <label class="interrupteur">🔊 Lire les phrases à voix haute<input type="checkbox" id="rVoix"></label>
  <label class="interrupteur">🐢 Voix lente<input type="checkbox" id="rLente"></label>
  <hr class="sep">
  <div class="reglage-titre">Étiquettes « Construire »</div>
  <div class="seg" id="rEtiquettes"><button type="button" data-v="auto">Automatique</button><button type="button" data-v="toujours">Toujours</button><button type="button" data-v="jamais">Jamais</button></div>
  <div class="reglage-titre">Longueur de la séance</div>

  <label class="interrupteur">Accord du participe avec avoir (difficile)<input type="checkbox" id="rCod"></label>
  <p class="muted petit">Ex. : « Ces pommes, je les ai mangées. » Désactivé au départ : c'est le point le plus dur du programme.</p>
  <hr class="sep">
  <div class="pile" style="gap:10px">
    <button class="btn btn-petit" id="rLecon0" type="button">🚂 Revoir « Le verbe en 3 morceaux »</button>
    <p class="muted petit">Tout reste sur cet appareil. Rien n'est envoyé sur Internet.</p>
  </div>
  <button class="btn btn-action" id="rFermer" type="button" style="margin-top:12px">Fermer</button>
</dialog>
<script>
(function () {
  'use strict';
  /* ---------- Créatures de récompense ---------- */
  // Dessins en viewBox 100 × 100, contour commun ajouté par showCreature().
  var INK = '#2B2340', SKIN = '#FFE0CC', SKIN2 = '#F2BFA4';
  var uidN = 0;
  // Forme ombrée : couleur claire décalée vers le haut à gauche, ombre en bas à droite, contour par-dessus.
  function S(shape, base, shade, d) {
    var id = 'kc' + (++uidN);
    d = d == null ? 3 : d;
    return '<clipPath id="' + id + '"><' + shape + '/></clipPath>' +
      '<g clip-path="url(#' + id + ')" stroke="none"><' + shape + ' fill="' + shade + '"/>' +
      '<g transform="translate(' + -d + ' ' + -d + ')"><' + shape + ' fill="' + base + '"/></g></g><' + shape + ' fill="none"/>';
  }
  // Bras qui fait coucou : groupe .bras qui tourne autour de l'épaule (ox, oy).
  function B(s, ox, oy) { return '<g class="bras" style="transform-origin:' + ox + 'px ' + oy + 'px">' + s + '</g>'; }
  function mir(s) { return '<g transform="matrix(-1 0 0 1 100 0)">' + s + '</g>'; }
  function both(s) { return s + mir(s); }
  function hi(x, y, rx, ry, rot) {
    return '<ellipse cx="' + x + '" cy="' + y + '" rx="' + rx + '" ry="' + ry + '" fill="#fff" opacity=".65" stroke="none"' +
      (rot ? ' transform="rotate(' + rot + ' ' + x + ' ' + y + ')"' : '') + '/>';
  }
  function star(x, y, s, c) {
    return '<path d="M' + x + ' ' + (y - s) + 'Q' + x + ' ' + y + ' ' + (x + s) + ' ' + y + 'Q' + x + ' ' + y + ' ' + x + ' ' + (y + s) +
      'Q' + x + ' ' + y + ' ' + (x - s) + ' ' + y + 'Q' + x + ' ' + y + ' ' + x + ' ' + (y - s) + 'z" fill="' + (c || '#FFC93C') + '" stroke-width="1.2"/>';
  }
  function ground(rx, y) { return '<ellipse cx="50" cy="' + (y || 91) + '" rx="' + (rx || 22) + '" ry="3" fill="' + INK + '" opacity=".14" stroke="none"/>'; }
  // Tube à contour (cou, tentacule…) : un trait épais foncé puis un trait coloré plus fin.
  function tube(d, c, w) {
    return '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="' + (w + 5) + '"/><path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="' + w + '"/>';
  }
  // Contour duveteux autour d'une ellipse.
  function fluff(cx, cy, rx, ry, n, b) {

  }

  /* ---------- Messages d'erreur (cahier des charges § 8) ---------- */
  function nomPers(q, p) { return p === q.p ? q.sujet : ['je', 'tu', 'il', 'nous', 'vous', 'ils'][p]; }
  function messageErreur(q, d) {
    if (!d) return 'Regarde bien le modèle.';
    var T = T_ID[q.tps], g = q.g === '?' ? 'm' : q.g, f = M.famille(q.inf), ty = M.G1_TYPE[q.inf];
    switch (d.type) {
      case 'accent': return /ç/.test(d.bonne) && M.sansAccent(d.bonne).indexOf('c') >= 0 && q.derniere.indexOf('ç') < 0 ? 'Presque ! Regarde la cédille : ' + htmlForme(q.m) : 'Presque ! Regarde l\'accent.';

        return 'Le participe de <i>' + esc(q.inf) + '</i>, c\'est <b>' + esc(pp.join('')) + '</b>' + (fem ? ' (pense au féminin : ' + esc(pp[0] + fem) + ')' : '') + '.';

        if (ty === 'ger' && /ge$/.test(q.m[0].t)) return 'Devant a et o, on garde le e : ' + htmlForme(q.m) + ' (le e garde le son « je »).';
        if (q.tps === 'fut' && M.groupe(q.inf) === 1 && q.inf !== 'aller') return 'Au futur, on garde le e de l\'infinitif : ' + htmlForme(q.m) + '.';
        if (q.tps === 'fut' && f.id !== 'g2') return 'Au futur, <i>' + esc(q.inf) + '</i> a un radical spécial : <b>' + esc(q.m[0].t) + '-</b>. On l\'apprend comme un mot.';
        if (ty === 'yer') return 'Devant un e muet, le y devient i : ' + htmlForme(q.m) + '.';
        if (ty === 'double') return 'Devant un e muet, on double la consonne : ' + htmlForme(q.m) + '.';
        if (ty === 'grave' || ty === 'aigu') return 'Devant un e muet, on entend « è » : ' + htmlForme(q.m) + '.';
        if (q.tps === 'imp') return 'Le radical de l\'imparfait, c\'est celui de <i>nous</i> au présent : ' + htmlForme(q.m) + '.';
        if (M.groupe(q.inf) === 3) return 'Ce verbe est irrégulier : on l\'apprend comme un mot. Regarde le radical (wagon bleu) : ' + htmlForme(q.m) + '.';
        return 'Regarde le radical (le wagon bleu) : ' + htmlForme(q.m) + '.';
      case 'marqueTemps':
        if (q.tps === 'imp') return 'La marque de l\'imparfait, c\'est <b>ai</b> (ou <b>i</b> avec nous et vous) : ' + htmlForme(q.m) + '.';

  /* ---------- Répondre ---------- */
  function taper(k) {
    if (!Q || !clavierQ(Q) || Q.phase === 'bon' || Q.phase === 'fini') return;
    if (k === 'del') Q.tape = Array.from(Q.tape).slice(0, -1).join('');
    else if (Q.tape.length < 30) { if (k === ' ' && (!Q.tape || / $/.test(Q.tape))) return; Q.tape += k; }
    rendreTape();
  }
  function rendreTape() {
    var q = Q;
    if (q.type === 'ecrire') { var t = $('#jTape'); if (t) t.outerHTML = tapeHTML(q, true); }
    else rendreQ();
    var v = $('#jValider'); if (v) v.disabled = !q.tape.trim();
  }
  function compter(q, juste) {
    var a = auj();
    if (!q.retour) {
      var jj = J.jours[a] || (J.jours[a] = { q: 0, ok: 0 }); jj.q++; if (juste) jj.ok++;
      var jt = J.temps[q.tps] || (J.temps[q.tps] = { q: 0, ok: 0 }); jt.q++; if (juste) jt.ok++;
    }
    SES.res[SES.items.filter(function (x) { return x.k === 'q'; }).indexOf(SES.items[SES.i])] = juste;
    if (q.retour || !q.id) return;
    if (q.bilan) { SES.bilanRes[q.id] = { juste: juste, q: q }; return; }
    var c = carte(q.id);
    if (q.p != null && q.type !== 'son') c.rat[q.p] = Math.max(0, (c.rat[q.p] || 0) + (juste ? -1 : 1));
    if (!q.decouverte) noter(q.id, juste);
  }
  function journalErreur(q, d, rep) {
    var c = carte(q.id || 'x:x');
    c.err[d.type] = (c.err[d.type] || 0) + 1;
    J.erreurs.push({ d: auj(), t: q.tps || 'son', ty: d.type, ex: (q.sujet ? M.sujetDevant(q.sujet, rep) + (M.sujetDevant(q.sujet, rep) === "j'" ? '' : ' ') : '') + rep });
    if (J.erreurs.length > 400) J.erreurs = J.erreurs.slice(-400);
  }
  function valider() {
    var q = Q;
    if (q.phase === 'bon' || q.phase === 'fini') return;
    var rep;
    if (q.type === 'construire') {
      if (!q.cases.every(function (c) { return q.poses[c.k] != null; })) return;
      var bouts = q.cases.map(function (c) { return q.eti[q.poses[c.k]].t; });
      rep = T_ID[q.tps].aux ? bouts[0] + ' ' + bouts.slice(1).join('') : bouts.join('');
    } else rep = M.sansSujet(q.tape, q.sujet);
    if (!rep) return;
    var juste = q.ok.indexOf(rep) >= 0;
    if (q.phase === 'copie') {
      if (juste) { q.phase = 'fini'; q.juste = false; finQuestion(); }
      else { anime($('#jZone'), 'anim-non'); vibre(); if (clavierQ(q)) { q.tape = ''; rendreTape(); } }
      return;
    }
    if (q.essai === 0) compter(q, juste);
    q.derniere = rep;
    if (juste) return bonneReponse();
    q.essai++;
    var d = M.diagnostic({ inf: q.inf, tps: q.tps, p: q.p, g: q.g, cod: q.cod }, rep) || { type: 'autre' };
    q.diag = d;
    if (q.id) journalErreur(q, d, rep);
    if (q.test || q.bilan) { q.phase = 'fini'; q.juste = false; son('non'); return finQuestion(); }
    son('non'); vibre();
    if (q.type === 'construire') {
      q.casesFausses = q.cases.map(function (c, i) { return q.eti[q.poses[c.k]].t !== c.t ? i : -1; }).filter(function (i) { return i >= 0; });
    }
    if (q.essai >= 2 || d.type === 'autre') {
      q.phase = 'copie';
      if (clavierQ(q)) q.tape = ''; else q.poses = {};
      if (!q.retour && !q.recit) planifierRetour(q);
    } else q.phase = 'faux';
    rendreQ();
    anime($('#jZone'), 'anim-non');
  }
  function planifierRetour(q) {
    var o = { p: q.p, inf: q.type === 'trou' ? null : q.inf, retour: true };
    var n = q.type === 'reconnaitre' || q.type === 'son' ? q.type : q.type === 'construire' ? 'construire' : 'ecrire';
    var copie = q.type === 'son' ? fabriquer(q.id, 'son', { retour: true }) : fabriquer(q.id, n, o);
    copie.decouverte = null;
    var at = Math.min(SES.items.length, SES.i + 4);
    // ne pas couper un récit ou un bloc de leçon
    while (at < SES.items.length && SES.items[at].k === 'q' && SES.items[at].q.recit) at++;
    SES.items.splice(at, 0, { k: 'q', q: copie });
  }
  function bonneReponse() {
    var q = Q;
    q.phase = 'bon'; q.juste = q.essai === 0;
    if (q.test || q.bilan) q.phase = 'fini';
    son('bon');
    finQuestion();
    rendreQ();
    anime($('#jZone'), 'anim-bravo');
    if (q.juste && !q.bilan) {
      pluieEtoiles(3);
      if (!q.retour && Math.random() < 0.2) { var s = $('#jCreature'); s.hidden = false; dessinCreature(s); }
    }
  }
  function finQuestion() {
    var q = Q;
    if (q.finDecouverte) decouvrir(q.decouverte);
    if (q.recit && SES.items[SES.i + 1] && SES.items[SES.i + 1].k === 'recitFin') J.recits[q.recit.r] = auj();
    // fin d'un bilan : cartes réussies → boîte 2
    if (q.bilan && !SES.items.slice(SES.i + 1).some(function (x) { return x.k === 'q' && x.q.bilan; })) {
      var a = auj();
      Object.keys(SES.bilanRes).forEach(function (id) { if (SES.bilanRes[id].juste && !boite(id)) { var c = carte(id); c.b = 2; c.d = plus(a, 2); c.j = a; c.vu = a; } });
      B[q.bilan] = a; B._jour = a;
    }
    sauver();
    if (q.phase === 'fini') rendreQ();
  }
  function choisir(i) {
    var q = Q, c = q.choix[i];
    if (!c || q.phase === 'bon' || q.phase === 'fini') return;
    var juste = q.bons.indexOf(c.v) >= 0;
    if (q.essai === 0) compter(q, juste);
    if (juste) return bonneReponse();
    q.essai++;
    if (q.id) journalErreur(q, { type: q.type === 'son' ? 'son' : q.mode === 'temps' ? 'temps' : 'personne' }, q.type === 'son' ? q.ph.rep + '→' + c.v : q.vu);
    q.rates = (q.rates || []).concat([c.v]);

    if (q.test || q.essai >= 2) { q.phase = 'fini'; q.juste = false; if (!q.test && !q.retour) planifierRetour(q); finQuestion(); }
    else { q.phase = 'faux'; rendreQ(); }

  }
  function choisirBulle(i) {
    var q = Q;

    else { q.bullesRatees = (q.bullesRatees || []).concat([i]); rendreQ(); anime(document.querySelector('[data-bulle="' + i + '"]'), 'anim-non'); }
  }
  function poserEtiquette(i) {
    var q = Q;

    var e = q.eti[i];

    if (q.phase === 'faux') q.casesFausses = [];

  }

  }

  /* ---------- Carnet du parent ---------- */
  var NOM_ERREUR = { accent: 'accent', temps: 'mauvais temps', personne: 'mauvaise personne', auxiliaire: 'mauvais auxiliaire', auxTemps: 'auxiliaire au mauvais temps', participe: 'participe passé', accord: 'accord du participe', radical: 'radical', marqueTemps: 'marque de temps', marquePersonne: 'marque de personne', autre: 'autre', son: 'son /é/' };
  function resume() {
    var a = auj(), jours = 0, nq = 0, l = [];
    for (var i = 13; i >= 0; i--) { var j = J.jours[plus(a, -i)]; if (j && j.q) { jours++; nq += j.q; } }
    l.push('Verbes en couleurs — résumé du ' + a.split('-').reverse().join('/'));
    l.push('Jours joués (14 derniers jours) : ' + jours + ' ; questions : ' + nq);
    TEMPS.forEach(function (t) {
      var s = J.temps[t.id], ids = idsDuTemps(t.id);
      l.push(t.nom + ' : ' + ids.filter(function (id) { return boite(id) === 6; }).length + ' sues, ' + ids.filter(function (id) { var b = boite(id); return b > 0 && b < 6; }).length + ' en cours, ' + ids.filter(function (id) { return !boite(id); }).length + ' pas vues' + (s && s.q ? ' ; réussite au 1er essai ' + Math.round(100 * s.ok / s.q) + ' %' : ''));
    });
    erreursFrequentes().forEach(function (e) { l.push('Erreur fréquente — ' + e.txt); });
    return l.join('\n');
  }
  function erreursFrequentes() {
    var lim = plus(auj(), -7), g = {};
    J.erreurs.forEach(function (e) { if (e.d < lim) return; var k = e.t + '|' + e.ty; g[k] = g[k] || { n: 0, ex: e.ex, t: e.t, ty: e.ty }; g[k].n++; g[k].ex = e.ex; });
    return Object.keys(g).map(function (k) { return g[k]; }).sort(function (x, y) { return y.n - x.n; }).slice(0, 6).map(function (e) {
      return { txt: (T_ID[e.t] ? T_ID[e.t].nom : 'Son /é/') + ' : ' + NOM_ERREUR[e.ty] + ' ' + e.n + ' fois cette semaine (' + e.ex + ')' };
    });
  }
  function afficherParent() {
    var a = auj(), jours = '', nq = 0;
    for (var i = 13; i >= 0; i--) { var j = J.jours[plus(a, -i)]; if (j && j.q) nq += j.q; jours += '<i class="' + (j && j.q ? 'joue' : '') + '" title="' + plus(a, -i) + '"></i>'; }
    var ef = erreursFrequentes();
    $('#vParent').innerHTML = '<h2>📒 Carnet du parent</h2>' +
      '<section class="carte pile"><div class="etiquette">Ce qui est su, en cours, pas vu</div>' + tableauHTML() + '</section>' +
      '<section class="carte pile"><div class="etiquette">Les 14 derniers jours</div><div class="jours">' + jours + '</div><p>' + nq + ' questions faites.</p>' +
      '<table class="stats"><tr><th>Temps</th><th>Réussite au 1er essai</th></tr>' + TEMPS.map(function (t) { var s = J.temps[t.id]; return '<tr><td>' + t.emoji + ' ' + t.nom + '</td><td class="n">' + (s && s.q ? Math.round(100 * s.ok / s.q) + ' % (' + s.q + ')' : '—') + '</td></tr>'; }).join('') + '</table></section>' +
      '<section class="carte pile"><div class="etiquette">Erreurs les plus fréquentes (7 jours)</div>' + (ef.length ? ef.map(function (e) { return '<p>' + esc(e.txt) + '</p>'; }).join('') : '<p class="muted">Aucune erreur cette semaine.</p>') + '</section>' +
      '<section class="carte pile"><div class="etiquette">Marquer un temps comme vu</div><p class="muted petit">Met toutes ses cartes en boîte 1 (si votre enfant le connaît déjà bien).</p><div class="choix-temps">' +
      TEMPS.map(function (t) { return '<button type="button" data-vu="' + t.id + '">' + t.emoji + ' ' + t.nom + '</button>'; }).join('') + '</div></section>' +
      '<button class="btn" type="button" id="pCopier">📋 Copier le résumé</button><p class="centre muted petit" id="pCopie" hidden>Résumé copié.</p>' +
      '<button class="btn btn-petit" type="button" id="pZero" style="justify-self:center">↺ Remettre à zéro</button>';
    montrer('vParent');
  }

  /* ---------- Réglages ---------- */
  function appliquerPrefs() { document.documentElement.classList.toggle('calme', !P.anim); }
  function ouvrirReglages() {
    ['son', 'anim', 'vibre', 'voix', 'lente', 'cod'].forEach(function (k) { $('#r' + k[0].toUpperCase() + k.slice(1)).checked = !!P[k]; });
    segs();
    $('#dReglages').showModal();
  }
  function segs() {
    document.querySelectorAll('#rEtiquettes button').forEach(function (b) { b.classList.toggle('on', b.dataset.v === P.etiquettes); });
    document.querySelectorAll('#rLongueur button').forEach(function (b) { b.classList.toggle('on', +b.dataset.v === +P.longueur); });
  }

  /* ---------- Branchements ---------- */
  function retourAccueil() { SES = null; Q = null; LECON = null; afficherAccueil(); }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || b.disabled) return;
    var d = b.dataset, id = b.id;
    if (d.k != null) return taper(d.k);
    if (d.eti != null) return poserEtiquette(+d.eti);
    if (d.case != null) { if (Q && Q.poses[d.case] != null) poserEtiquette(Q.poses[d.case]); return; }
    if (d.choix != null) return choisir(+d.choix);
    if (d.bulle != null) return choisirBulle(+d.bulle);
    if (d.temps) return afficherTemps(d.temps);
    if (d.lecon) return ouvrirLecon(d.lecon, function () { afficherTemps(d.lecon); });
    if (d.serie) return lancer(serieTemps(d.serie, 10), 'temps');
    if (d.bilan) return lancer(bilan(d.bilan), 'bilan');
    if (d.carte) return lancer(serieCarte(d.carte), 'carte');
    if (d.caseT) return afficherTableau(d.caseT);
    if (d.recit) return lancer(recit(+d.recit), 'recit');
    if (d.pers != null) return personneLecon(+d.pers);
    if (d.testT) { var k = TEST_CHOIX.indexOf(d.testT); if (k >= 0) TEST_CHOIX.splice(k, 1); else TEST_CHOIX.push(d.testT); return afficherTest(); }
    if (d.vu) {
      if (!confirm('Mettre toutes les cartes « ' + T_ID[d.vu].nom + ' » en boîte 1 ?')) return;
      idsDuTemps(d.vu).forEach(function (cid) { if (!boite(cid)) { var c = carte(cid); c.b = 1; c.d = plus(auj(), 1); } });
      J.lecons[d.vu] = true; sauver(); return afficherParent();
    }
    if (d.v && b.parentNode.id === 'rEtiquettes') { P.etiquettes = d.v; sauverPrefs(); return segs(); }
    if (d.v && b.parentNode.id === 'rLongueur') { P.longueur = +d.v; sauverPrefs(); return segs(); }
    switch (id) {
      case 'bSeance': return lancer(seanceDuJour(), 'jour');
      case 'bTableau': return afficherTableau();
      case 'bSon': return lancer(serieSon(), 'son');
      case 'bRecits': return afficherRecits();
      case 'bTest': return afficherTest();
      case 'tGo': return lancer(serieTest(TEST_CHOIX.slice().sort(function (x, y) { return T_ID[x].i - T_ID[y].i; })), 'test');
      case 'bParent': return afficherParent();
      case 'bRetour': return retourAccueil();
      case 'bReglages': return ouvrirReglages();
      case 'rFermer': $('#dReglages').close(); if (VUE === 'vAccueil') afficherAccueil(); return;
      case 'rLecon0': $('#dReglages').close(); return ouvrirLecon('zero', retourAccueil);
      case 'lSuivant': return suivantLecon();
      case 'lAvant': LECON.etape--; return rendreLecon();
      case 'lBouton': {
        var el = $('#lChange'); el.dataset.n = el.dataset.n === '1' ? '0' : '1';
        el.innerHTML = el.dataset.n === '1' ? 'nous ' + fc('chanter', 'fut', 3) + ' <small class="muted">(futur)</small>' : 'nous ' + fc('chanter', 'imp', 3) + ' <small class="muted">(imparfait)</small>';
        return;
      }
      case 'jValider': return valider();
      case 'jSuivant': return suivant();
      case 'jEcoute': return lireQ();
      case 'jRoutine': Q.routine = true; return rendreQ();
      case 'fContinuer': return avancer();
      case 'fAccueil': return retourAccueil();
      case 'fEncore': return lancer(serieEncore(), 'encore');
      case 'pCopier': {
        var t = resume(), ok = function () { $('#pCopie').hidden = false; };
        if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, function () { prompt('Résumé :', t); }); else prompt('Résumé :', t);
        return;
      }
      case 'pZero':
        if (!confirm('Effacer tous les progrès de cet appareil ?')) return;
        C = {}; J = { jours: {}, temps: {}, erreurs: [], lecons: {}, recits: {} }; B = {}; sauver(); return retourAccueil();
    }
  });
  ['son', 'anim', 'vibre', 'voix', 'lente', 'cod'].forEach(function (k) {
    $('#r' + k[0].toUpperCase() + k.slice(1)).addEventListener('change', function (e) { P[k] = e.target.checked; sauverPrefs(); appliquerPrefs(); });
  });
  // Clavier physique (ordinateur, tablette avec clavier)
  document.addEventListener('keydown', function (e) {
    if (VUE !== 'vJeu' || !Q || e.ctrlKey || e.metaKey || e.altKey || $('#dReglages').open) return;
    if (Q.phase === 'bon' || Q.phase === 'fini') { if (e.key === 'Enter') { e.preventDefault(); suivant(); } return; }
    if (!clavierQ(Q)) return;
    if (e.key === 'Backspace') { e.preventDefault(); taper('del'); }
    else if (e.key === 'Enter') { e.preventDefault(); valider(); }
    else if (e.key.length === 1 && /[\p{L}' ’-]/u.test(e.key)) { e.preventDefault(); taper(e.key === '’' ? "'" : e.key.toLowerCase()); }
  });
  document.addEventListener('visibilitychange', function () { if (document.hidden && SYNTH) try { SYNTH.cancel(); } catch (e) { /* rien */ } });

  /* ---------- Touche qui s'éclaire quand on appuie (écran ou clavier physique) ---------- */
  // Le clavier peut être redessiné à chaque lettre : on retrouve la touche par son data-k.
  function toucheVisible(k) {
    return Array.prototype.find.call(document.querySelectorAll('#kb [data-k]'), function (b) {
      return b.getAttribute('data-k') === k && b.getClientRects().length;
    });
  }
  function eclaireTouche(b) {
    if (!b) return;
    b.classList.remove('allume'); void b.offsetWidth; b.classList.add('allume');
    clearTimeout(b._allume);
    b._allume = setTimeout(function () { b.classList.remove('allume'); }, 300);
  }
  var toucheAppuyee = null;
  document.addEventListener('pointerdown', function (e) {
    var b = e.target.closest && e.target.closest('#kb [data-k]');
    toucheAppuyee = b;
    if (b && !b.disabled) eclaireTouche(b);
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('#kb [data-k]'), k = b ? b.getAttribute('data-k') : null;
    if (k == null && toucheAppuyee && !toucheAppuyee.isConnected) k = toucheAppuyee.getAttribute('data-k');
    if (k == null) return;
    // Clic au clavier (Entrée sur la touche) ou touche redessinée : on rallume la bonne.
    var v = toucheVisible(k);
    if (v && v !== toucheAppuyee) eclaireTouche(v);
    toucheAppuyee = null;
  });
  document.addEventListener('keydown', function (e) {
    if (!e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key === 'Backspace' ? 'del' : e.key === '’' ? "'" : e.key.length === 1 ? e.key.toLowerCase() : null;
    if (k != null) eclaireTouche(toucheVisible(k));
  });

  /* ---------- Démarrage ---------- */
  appliquerPrefs();
  if (!P.lecon0) ouvrirLecon('zero', afficherAccueil); else afficherAccueil();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(function () { /* hors ligne indisponible */ });

  // Crochet pour les tests automatiques
  window.__verbes = {
    M: M,
    etat: function () {
      return { vue: VUE, lecon: LECON && LECON.tps, q: Q && { type: Q.type, id: Q.id, tps: Q.tps, p: Q.p, inf: Q.inf, phase: Q.phase, essai: Q.essai, attendu: Q.ok && Q.ok[0], ok: Q.ok, mode: Q.mode, bons: Q.bons, bulle: Q.bulle, etapeBulle: Q.etapeBulle && !Q.bulleOk, diag: Q.diag && Q.diag.type, retour: Q.retour, recit: !!Q.recit },
        seance: SES && { i: SES.i, n: SES.items.length, mode: SES.mode, items: SES.items.map(function (x) { return x.k === 'q' ? x.q.type + ':' + (x.q.id || '') : x.k; }) } };
    },
    // Joue la bonne réponse (ou l'étape suivante) sur l'écran en cours.
    juste: function () {
      if (VUE === 'vLecon') return suivantLecon();
      if (VUE === 'vFin') { var c = $('#fContinuer'); if (c) c.click(); return; }
      if (VUE !== 'vJeu' || !Q) return;
      var q = Q;
      if (q.phase === 'bon' || q.phase === 'fini') return;
      if (q.type === 'construire') { q.poses = {}; q.cases.forEach(function (c) { var e = q.eti.filter(function (x) { return x.k === c.k && x.t === c.t; })[0]; q.poses[c.k] = e.i; }); rendreQ(); return valider(); }
      if (q.type === 'reconnaitre' || q.type === 'son') {
        if (q.type === 'son' && q.etapeBulle && !q.bulleOk) choisirBulle(q.bulle);
        return choisir(q.choix.findIndex(function (c) { return q.bons.indexOf(c.v) >= 0; }));
      }
      q.tape = q.ok[0]; return valider();
    },
    repondre: function (t) { if (!Q) return; if (Q.type === 'reconnaitre' || Q.type === 'son') return choisir(Q.choix.findIndex(function (c) { return String(c.v) === String(t); })); Q.tape = t; valider(); },
    faux: function () {   // une réponse fausse plausible pour la question en cours
      if (!Q) return;
      if (Q.type === 'reconnaitre' || Q.type === 'son') return choisir(Q.choix.findIndex(function (c) { return Q.bons.indexOf(c.v) < 0 && (Q.rates || []).indexOf(c.v) < 0; }));
      if (Q.type === 'construire') { Q.poses = {}; Q.cases.forEach(function (c) { var e = Q.eti.filter(function (x) { return x.k === c.k && x.t !== c.t; })[0] || Q.eti.filter(function (x) { return x.k === c.k; })[0]; Q.poses[c.k] = e.i; }); rendreQ(); return valider(); }
      Q.tape = Q.ok[0] + 'x'; valider();
    },
    suivant: function () { var s = $('#jSuivant') || $('#fContinuer') || $('#lSuivant'); if (s) s.click(); },
    seance: function () { lancer(seanceDuJour(), 'jour'); },
    plan: function () { var p = planDuJour(); return { rev: p.rev, nouv: p.nouv, bilan: p.bilan }; },
    lancer: function (quoi, x) {
      if (quoi === 'temps') return lancer(serieTemps(x, 10), 'temps');
      if (quoi === 'carte') return lancer(serieCarte(x), 'carte');
      if (quoi === 'test') return lancer(serieTest(x || ['pres', 'ps']), 'test');
      if (quoi === 'son') return lancer(serieSon(), 'son');
      if (quoi === 'recit') return lancer(recit(x || 0), 'recit');
      if (quoi === 'bilan') return lancer(bilan(x), 'bilan');
      if (quoi === 'type') { var it = { k: 'q', q: fabriquer(x.id, x.type, x) }; return lancer([it], 'carte'); }
    },
    jours: function (n) { DECALAGE = n; if (VUE === 'vAccueil') afficherAccueil(); },
    cartes: function () { return JSON.parse(JSON.stringify(C)); },
    bilans: function () { return JSON.parse(JSON.stringify(B)); },
    aller: function (v) { ({ accueil: afficherAccueil, tableau: afficherTableau, parent: afficherParent, recits: afficherRecits, test: afficherTest })[v](); },
    temps: afficherTemps,
    lecon: function (t) { ouvrirLecon(t, afficherAccueil); },
    accueil: retourAccueil
  };
})();
</script>
